<div class="pautas-container">
  <h2>Pautas</h2>
  
  <div class="form-group">
    <label>Título:</label>
    <input type="text" [(ngModel)]="novoTitulo" placeholder="Título da pauta" required>
  </div>
  
  <div class="form-group">
    <label>Descrição:</label>
    <input type="text" [(ngModel)]="novaDescricao" placeholder="Descrição da pauta">
  </div>
  
  <button class="btn-criar" (click)="criarPauta()">Criar Pauta</button>
  
  <div *ngIf="pautas.length > 0" class="pautas-list">
    <h3>Pautas Cadastradas</h3>
    <table class="pautas-table">
      <thead>
        <tr>
          <th>ID</th>
          <th>Título</th>
          <th>Descrição</th>
          <th>Criada em</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let pauta of pautas">
          <td>{{ pauta.id }}</td>
          <td>{{ pauta.titulo }}</td>
          <td>{{ pauta.descricao }}</td>
          <td>{{ pauta.criadaEm | date:'dd/MM/yyyy HH:mm' }}</td>
          <td class="actions">
            <a [routerLink]="['/pautas', pauta.id, 'sessao']" class="btn-action">Abrir Sessão</a>
            <a [routerLink]="['/pautas', pauta.id, 'votar']" class="btn-action btn-votar">Votar</a>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
  
  <div *ngIf="pautas.length === 0" class="empty-state">
    <p>Nenhuma pauta encontrada.</p>
  </div>
</div>
